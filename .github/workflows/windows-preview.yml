name: Windows build

"on":
  push:
    branches: [main, restart/bilingual]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

jobs:
  build-windows:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/restart/bilingual'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare bundled FFmpeg (latest)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archiveUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          $archivePath = Join-Path $env:RUNNER_TEMP 'ffmpeg-master-latest-win64-gpl.zip'
          $extractDir = Join-Path $env:RUNNER_TEMP 'ffmpeg-master-latest-win64-gpl'
          $ffmpegDir = Join-Path $env:GITHUB_WORKSPACE 'ffmpeg'

          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }
          if (Test-Path $extractDir) {
            Remove-Item $extractDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $ffmpegDir -Force | Out-Null

          Write-Host "Downloading FFmpeg archive: $archiveUrl"
          Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force

          $ffmpegExe = Get-ChildItem -Path $extractDir -Recurse -File -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $extractDir -Recurse -File -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $ffmpegExe -or -not $ffprobeExe) {
            throw "Failed to locate ffmpeg.exe or ffprobe.exe in extracted archive."
          }

          Copy-Item -Path $ffmpegExe.FullName -Destination (Join-Path $ffmpegDir 'ffmpeg.exe') -Force
          Copy-Item -Path $ffprobeExe.FullName -Destination (Join-Path $ffmpegDir 'ffprobe.exe') -Force

          $licenseCandidate = Get-ChildItem -Path $extractDir -Recurse -File |
            Where-Object { $_.Name -in @('COPYING.GPLv3', 'LICENSE.GPLv3', 'GPLv3.txt', 'LICENSE.txt', 'COPYING') } |
            Select-Object -First 1
          if (-not $licenseCandidate) {
            throw "Failed to locate FFmpeg GPLv3 license file in extracted archive."
          }
          Copy-Item -Path $licenseCandidate.FullName -Destination (Join-Path $ffmpegDir 'FFMPEG_GPLv3.txt') -Force

          Write-Host "Validating downloaded FFmpeg binaries..."
          & (Join-Path $ffmpegDir 'ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) {
            throw "ffmpeg.exe validation failed."
          }
          & (Join-Path $ffmpegDir 'ffprobe.exe') -version
          if ($LASTEXITCODE -ne 0) {
            throw "ffprobe.exe validation failed."
          }

          # BtbN binary archives contain the license but no upstream README.
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/README.md' -OutFile (Join-Path $ffmpegDir 'FFMPEG_README.txt')
          Add-Content -Path $env:GITHUB_PATH -Value $ffmpegDir

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: FFmpeg test preflight
        run: python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe'), 'FFmpeg must be on PATH'"

      - name: Run offline bilingual regressions
        run: python tools/run_offline_tests.py test_bilingual test_bilingual_vtt test_subtitle_translator_pairing test_offline_runner test_windows_preview test_upload_copyright_type test_description_preservation test_bundled_subtitle_fonts test_frozen_font_resolution test_platform_metadata_limits

      - name: Run maintenance regressions
        run: python -m pytest tests/test_description_budget.py tests/test_subtitle_failure_policy.py tests/test_subtitle_strict_default.py tests/test_bilibili_uploader.py

      - name: Build Windows EXE using upstream packager
        working-directory: build-tools
        run: python build_exe.py

      - name: Verify packaged FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bundleDir = Join-Path $env:GITHUB_WORKSPACE 'build-tools/dist/Y2A-Auto/ffmpeg'
          $requiredFiles = @('ffmpeg.exe', 'ffprobe.exe', 'FFMPEG_GPLv3.txt', 'FFMPEG_README.txt')

          foreach ($file in $requiredFiles) {
            $path = Join-Path $bundleDir $file
            if (-not (Test-Path $path)) {
              throw "Missing packaged FFmpeg file: $path"
            }
          }

          & (Join-Path $bundleDir 'ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged ffmpeg.exe validation failed."
          }
          & (Join-Path $bundleDir 'ffprobe.exe') -version
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged ffprobe.exe validation failed."
          }

      - name: Check package boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'build-tools/dist/Y2A-Auto'
          if (-not (Test-Path "$bundle/Y2A-Auto.exe")) { throw 'Application EXE missing' }
          # Upstream creates empty runtime directories. Never ship runtime data.
          foreach ($name in @('config', 'cookies', 'db', 'logs', 'downloads', 'temp')) {
            $path = Join-Path $bundle $name
            if (Test-Path $path) {
              if (Get-ChildItem $path -Recurse -File) { throw "Unexpected runtime files: $name" }
              Remove-Item $path -Recurse -Force
            }
          }
          $forbidden = Get-ChildItem $bundle -Recurse -Force | Where-Object {
            $_.Name -in @('.venv', '.git', 'audit', 'tests', '.env', 'config.json', 'cookies.txt') -or
            $_.Extension -in @('.db', '.sqlite', '.sqlite3', '.log', '.vtt', '.srt')
          }
          if ($forbidden) { throw 'Unexpected runtime or test data in bundle' }

      - name: Archive build output
        run: Compress-Archive -Path build-tools/dist/Y2A-Auto/* -DestinationPath Y2A-Auto-win64-preview.zip

      - name: Verify frozen font lookup against built ZIP
        env:
          Y2A_PORTABLE_ZIP: ${{ github.workspace }}/Y2A-Auto-win64-preview.zip
        run: python tools/run_offline_tests.py test_frozen_font_resolution

      - uses: actions/upload-artifact@v4
        with:
          name: Y2A-Auto-win64-preview-${{ github.sha }}
          path: Y2A-Auto-win64-preview.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
