name: Windows preview artifact (no release)

"on":
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-preview:
    # The UI ref selector is not interpolated into a shell. Tags are not accepted.
    if: github.ref == 'refs/heads/preview' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install dependencies outside source tree
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install pytest PyYAML==6.0.3 pyinstaller -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

      - name: Prepare bundled FFmpeg and license
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          $archivePath = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extractDir = Join-Path $env:RUNNER_TEMP 'ffmpeg-extracted'
          $ffmpegDir = Join-Path $env:RUNNER_TEMP 'preview-ffmpeg'
          New-Item -ItemType Directory -Path $ffmpegDir -Force | Out-Null
          Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force
          foreach ($file in @('ffmpeg.exe', 'ffprobe.exe')) {
            $binary = Get-ChildItem -Path $extractDir -Recurse -File -Filter $file | Select-Object -First 1
            if (-not $binary) { throw "Missing FFmpeg binary: $file" }
            Copy-Item -LiteralPath $binary.FullName -Destination (Join-Path $ffmpegDir $file)
            & (Join-Path $ffmpegDir $file) -version
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg validation failed: $file" }
          }
          $license = Get-ChildItem -Path $extractDir -Recurse -File |
            Where-Object { $_.Name -in @('COPYING.GPLv3', 'LICENSE.GPLv3', 'GPLv3.txt', 'LICENSE.txt', 'COPYING') } |
            Select-Object -First 1
          if (-not $license) { throw 'FFmpeg GPL license missing' }
          Copy-Item -LiteralPath $license.FullName -Destination (Join-Path $ffmpegDir 'FFMPEG_GPLv3.txt')
          Set-Content -LiteralPath (Join-Path $ffmpegDir 'FFMPEG_README.txt') -Value "Preview binary source: $archiveUrl`nUpstream source/build recipes: https://github.com/BtbN/FFmpeg-Builds`nFFmpeg source: https://ffmpeg.org/download.html" -Encoding utf8
          # Required by shutil.which in the real burn-in test, not just build_exe.py.
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $ffmpegDir

      - name: Run workflow contract tests
        run: |
          python -m pytest tests/test_windows_preview.py tests/test_offline_runner_cleanup.py -q -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { throw 'Preview contract tests failed' }

      - name: Run isolated bilingual tests including real burn-in
        run: |
          # Directed isolation only: do not use run_offline.py as a full-suite sandbox.
          python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe'), 'FFmpeg must be discoverable; no skipped smoke test'"
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg PATH preflight failed' }
          python tests/run_offline.py tests/test_bilingual_metadata.py tests/test_bilingual_output.py tests/test_bilingual_selection.py tests/test_bilingual_smoke.py tests/test_existing_bilingual_merge.py tests/test_existing_bilingual_settings.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Bilingual acceptance tests failed' }

      - name: Stage tracked build inputs only
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'preview-source'
          $archive = Join-Path $env:RUNNER_TEMP 'preview-source.tar'
          New-Item -ItemType Directory -Path $stage | Out-Null
          # Explicit allowlist: never copy checkout root, .venv, acfunid cache or runtime data.
          git archive --format=tar --output=$archive HEAD app.py modules templates static fonts build-tools requirements.txt LICENSE
          if ($LASTEXITCODE -ne 0) { throw 'Source export failed' }
          tar -xf $archive -C $stage
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed' }
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'preview-ffmpeg') -Destination (Join-Path $stage 'ffmpeg') -Recurse
          python build-tools/verify_preview.py --source $stage
          if ($LASTEXITCODE -ne 0) { throw 'Source boundary verification failed' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PREVIEW_SOURCE=$stage"

      - name: Build Windows portable application
        run: |
          Set-Location (Join-Path $env:PREVIEW_SOURCE 'build-tools')
          python build_exe.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }

      - name: Verify and archive portable output
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:PREVIEW_SOURCE 'build-tools/dist/Y2A-Auto'
          Copy-Item -LiteralPath (Join-Path $env:PREVIEW_SOURCE 'LICENSE') -Destination (Join-Path $bundle 'LICENSE')
          python build-tools/verify_preview.py $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Package boundary verification failed' }
          foreach ($file in @('ffmpeg.exe', 'ffprobe.exe')) {
            & (Join-Path $bundle "ffmpeg/$file") -version
            if ($LASTEXITCODE -ne 0) { throw "Packaged binary failed: $file" }
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'Y2A-Auto-windows-preview.zip')

      - name: Upload temporary preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Y2A-Auto-windows-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: Y2A-Auto-windows-preview.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
